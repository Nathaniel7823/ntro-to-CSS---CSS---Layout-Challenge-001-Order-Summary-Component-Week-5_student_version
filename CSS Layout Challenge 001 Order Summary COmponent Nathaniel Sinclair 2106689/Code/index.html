<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <img class="order-sum" src="../Images/illustration-hero.svg" alt="">
        <div class="details">
            <h2>Order Summary</h2>
            <p>You can now listen to millions of songs, audiobooks,
                 and podcasts on any device anywhere you like!
                </p>
                <div class="pricing">
                    <img src="../Images/icon-music.svg" alt="">
                    <ul>
                        <li><strong>Annual Plan</strong></li>
                        <li>$59.99/year</li>
                    </ul>
                    <a class="change" href="">Change</a>
                </div>
                <button>Proceed to Payment</button>
                
                <a href="#" class="cancel">Cancel Order</a>
        </div>


    </div>
    
</body>
</html>
